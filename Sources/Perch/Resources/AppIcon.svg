<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="v8d2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#3A3F4A"/>
      <stop offset="0.5" stop-color="#1E2128"/>
      <stop offset="1"   stop-color="#0C0E14"/>
    </linearGradient>
    <linearGradient id="v8d2-glass1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="v8d2-glass2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="v8d2-paper" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFEF6"/>
      <stop offset="1" stop-color="#EBE2C8"/>
    </linearGradient>
    <linearGradient id="v8d2-edge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="v8d2-paper-edge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="v8d2-shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="v8d2-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="v8d2-paper-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.62"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v8d2-bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v8d2-shine)"/>

  <g filter="url(#v8d2-shadow)" transform="translate(512 560) rotate(-10)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8d2-glass1)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="none" stroke="url(#v8d2-edge)" stroke-width="3"/>
  </g>
  <g filter="url(#v8d2-shadow)" transform="translate(512 512) rotate(4)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8d2-glass2)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="none" stroke="url(#v8d2-edge)" stroke-width="3"/>
  </g>
  <g filter="url(#v8d2-paper-shadow)" transform="translate(512 478) rotate(-3)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8d2-paper)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="none" stroke="url(#v8d2-paper-edge)" stroke-width="3"/>
    <rect x="-200" y="-150" width="380" height="32" rx="16" fill="#1E2128" opacity="0.78"/>
    <rect x="-200" y="-70"  width="300" height="32" rx="16" fill="#1E2128" opacity="0.62"/>
    <rect x="-200" y="10"   width="360" height="32" rx="16" fill="#1E2128" opacity="0.62"/>
    <rect x="-200" y="90"   width="220" height="32" rx="16" fill="#1E2128" opacity="0.55"/>
  </g>
</svg>

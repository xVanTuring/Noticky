name: Noticky
options:
  bundleIdPrefix: tech.xvanturing
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: "0.3.1"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_NAME: Noticky
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # CloudKit / iCloud entitlements 强制要求真实 team signing,不能用 ad-hoc "-"。
    # T8F5T6HKG8 = "Shenzhen Zhiqishidai Technology" 企业账号。
    # ⚠️ CloudKit container `iCloud.tech.xvanturing.Noticky` 需要在该 team 的
    #    Apple Developer portal(https://developer.apple.com/account/resources/identifiers/list/cloudContainer)
    #    下手动创建,Identifier 完全一致;App ID `tech.xvanturing.Noticky` 也要
    #    在同一 team 注册并勾上 iCloud + Push Notifications capability。
    DEVELOPMENT_TEAM: T8F5T6HKG8
    CODE_SIGN_IDENTITY: "Apple Development"
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Noticky:
    type: application
    platform: macOS
    sources:
      - path: Sources/Noticky
        excludes:
          - "Resources/**"
      # Resources/** 整体排除是因为 Info.plist / entitlements 由 info.path 和
      # CODE_SIGN_ENTITLEMENTS 单独 wire,不能再走 Sources。AppIcon 的资产目录
      # 必须手动加回来,否则 Xcode 编译时找不到 CFBundleIconName 指向的资源。
      - Sources/Noticky/Resources/Assets.xcassets
    dependencies:
      - package: Textual
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.Noticky
        CODE_SIGN_ENTITLEMENTS: Sources/Noticky/Resources/Noticky.entitlements
    info:
      path: Sources/Noticky/Resources/Info.plist
      properties:
        CFBundleName: Noticky
        CFBundleDisplayName: Noticky
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Noticky"
        NSPrincipalClass: NSApplication
        CFBundleIconName: AppIcon

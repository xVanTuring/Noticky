name: Noticky
options:
  bundleIdPrefix: tech.xvanturing
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: "0.3.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_NAME: Noticky
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Noticky:
    type: application
    platform: macOS
    sources:
      - path: Sources/Noticky
        excludes:
          - "Resources/**"
    dependencies:
      - package: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.xvanturing.Noticky
        CODE_SIGN_ENTITLEMENTS: Sources/Noticky/Resources/Noticky.entitlements
    info:
      path: Sources/Noticky/Resources/Info.plist
      properties:
        CFBundleName: Noticky
        CFBundleDisplayName: Noticky
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Noticky"
        NSPrincipalClass: NSApplication
        CFBundleIconName: AppIcon

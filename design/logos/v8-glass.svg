<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft pastel gradient, Tahoe-ish -->
    <linearGradient id="v8-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#FFB4D6"/>
      <stop offset="0.5" stop-color="#B4A8FF"/>
      <stop offset="1"   stop-color="#7BD0FF"/>
    </linearGradient>

    <!-- Three translucent glass layers -->
    <linearGradient id="v8-glass1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="v8-glass2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="v8-glass3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFAE0" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="v8-edge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="v8-shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="v8-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v8-bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v8-shine)"/>

  <!-- Bottom-back glass card -->
  <g filter="url(#v8-shadow)" transform="translate(512 560) rotate(-10)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8-glass1)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56"
          fill="none" stroke="url(#v8-edge)" stroke-width="3"/>
  </g>

  <!-- Middle glass card -->
  <g filter="url(#v8-shadow)" transform="translate(512 512) rotate(4)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8-glass2)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56"
          fill="none" stroke="url(#v8-edge)" stroke-width="3"/>
  </g>

  <!-- Top glass card with content -->
  <g filter="url(#v8-shadow)" transform="translate(512 478) rotate(-3)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8-glass3)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56"
          fill="none" stroke="url(#v8-edge)" stroke-width="3"/>
    <!-- content lines -->
    <rect x="-200" y="-150" width="380" height="30" rx="15" fill="#5A4F8F" opacity="0.55"/>
    <rect x="-200" y="-70"  width="300" height="30" rx="15" fill="#5A4F8F" opacity="0.55"/>
    <rect x="-200" y="10"   width="360" height="30" rx="15" fill="#5A4F8F" opacity="0.55"/>
    <rect x="-200" y="90"   width="220" height="30" rx="15" fill="#5A4F8F" opacity="0.55"/>
  </g>
</svg>

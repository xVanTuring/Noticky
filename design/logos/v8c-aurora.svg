<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Aurora: vivid magenta → violet → teal -->
    <linearGradient id="v8c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#FF3CA0"/>
      <stop offset="0.5" stop-color="#7B5BFF"/>
      <stop offset="1"   stop-color="#1FD1B5"/>
    </linearGradient>

    <linearGradient id="v8c-glass1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="v8c-glass2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="v8c-glass3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#F4ECFF" stop-opacity="0.78"/>
    </linearGradient>

    <linearGradient id="v8c-edge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="v8c-shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="v8c-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v8c-bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v8c-shine)"/>

  <g filter="url(#v8c-shadow)" transform="translate(512 560) rotate(-10)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8c-glass1)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="none" stroke="url(#v8c-edge)" stroke-width="3"/>
  </g>
  <g filter="url(#v8c-shadow)" transform="translate(512 512) rotate(4)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8c-glass2)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="none" stroke="url(#v8c-edge)" stroke-width="3"/>
  </g>
  <g filter="url(#v8c-shadow)" transform="translate(512 478) rotate(-3)">
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="url(#v8c-glass3)"/>
    <rect x="-280" y="-280" width="560" height="560" rx="56" fill="none" stroke="url(#v8c-edge)" stroke-width="3"/>
    <rect x="-200" y="-150" width="380" height="30" rx="15" fill="#3A1B6B" opacity="0.55"/>
    <rect x="-200" y="-70"  width="300" height="30" rx="15" fill="#3A1B6B" opacity="0.55"/>
    <rect x="-200" y="10"   width="360" height="30" rx="15" fill="#3A1B6B" opacity="0.55"/>
    <rect x="-200" y="90"   width="220" height="30" rx="15" fill="#3A1B6B" opacity="0.55"/>
  </g>
</svg>

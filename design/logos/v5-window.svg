<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="v5-bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFC95C"/>
      <stop offset="1" stop-color="#F08A22"/>
    </linearGradient>
    <linearGradient id="v5-window" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FDFDFD"/>
      <stop offset="1" stop-color="#E6E6E8"/>
    </linearGradient>
    <linearGradient id="v5-titlebar" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F2F2F4"/>
      <stop offset="1" stop-color="#DCDCE0"/>
    </linearGradient>
    <linearGradient id="v5-note" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFCE0"/>
      <stop offset="1" stop-color="#FFE066"/>
    </linearGradient>
    <linearGradient id="v5-shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="v5-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v5-bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v5-shine)"/>

  <!-- floating window panel -->
  <g filter="url(#v5-shadow)">
    <rect x="148" y="200" width="728" height="624" rx="56" fill="url(#v5-window)"/>
    <!-- title bar -->
    <path d="M 148 256
             A 56 56 0 0 1 204 200
             L 820 200
             A 56 56 0 0 1 876 256
             L 876 316
             L 148 316 Z"
          fill="url(#v5-titlebar)"/>
    <line x1="148" y1="316" x2="876" y2="316" stroke="#00000010" stroke-width="2"/>
    <!-- traffic lights -->
    <circle cx="208" cy="258" r="22" fill="#FF5F57"/>
    <circle cx="270" cy="258" r="22" fill="#FEBC2E"/>
    <circle cx="332" cy="258" r="22" fill="#28C840"/>

    <!-- sticky inside the window -->
    <g transform="translate(512 590) rotate(-3)">
      <g transform="translate(-260 -200)">
        <path d="M 0 0 L 520 0 L 520 360 L 460 400 L 0 400 Z" fill="url(#v5-note)"/>
        <path d="M 520 360 L 460 400 L 460 360 Z" fill="#E0B838"/>
        <rect x="44"  y="80"  width="360" height="28" rx="14" fill="#A07410" opacity="0.55"/>
        <rect x="44"  y="160" width="280" height="28" rx="14" fill="#A07410" opacity="0.55"/>
        <rect x="44"  y="240" width="320" height="28" rx="14" fill="#A07410" opacity="0.55"/>
      </g>
    </g>
  </g>
</svg>

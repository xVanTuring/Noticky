<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: warm amber squircle -->
    <linearGradient id="v1-bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFD86B"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <!-- Sticky note paper -->
    <linearGradient id="v1-paper" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFDF2"/>
      <stop offset="1" stop-color="#FFF1B8"/>
    </linearGradient>
    <!-- Inner highlight on squircle -->
    <linearGradient id="v1-shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow under the note -->
    <filter id="v1-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v1-bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#v1-shine)"/>

  <!-- Sticky note, rotated -7° around its own center -->
  <g transform="translate(512 512) rotate(-7)" filter="url(#v1-drop)">
    <g transform="translate(-330 -330)">
      <!-- paper, with subtle bottom-right fold notch -->
      <path d="M 0 0
               L 660 0
               L 660 580
               L 580 660
               L 0 660 Z"
            fill="url(#v1-paper)"/>
      <!-- folded corner (the triangle that shows the underside) -->
      <path d="M 660 580 L 580 660 L 580 580 Z"
            fill="#E6B834"/>
      <!-- a hint of shadow on the fold -->
      <path d="M 580 580 L 580 660 L 660 580 Z"
            fill="#000" opacity="0.06"/>

      <!-- text lines on the note -->
      <rect x="80" y="130" width="500" height="40" rx="20" fill="#C7892A" opacity="0.55"/>
      <rect x="80" y="230" width="420" height="40" rx="20" fill="#C7892A" opacity="0.55"/>
      <rect x="80" y="330" width="500" height="40" rx="20" fill="#C7892A" opacity="0.55"/>
      <rect x="80" y="430" width="340" height="40" rx="20" fill="#C7892A" opacity="0.55"/>
    </g>
  </g>
</svg>

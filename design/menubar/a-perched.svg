             C22 46.3 14 40 14 30
             Z
             M23.8 23 A1.9 1.9 0 1 1 20 23 A1.9 1.9 0 1 1 23.8 23 Z"/>
    <!-- beak -->
    <path d="M14.5 24 L4 23 L14 30 Z"/>
    <!-- legs -->
    <path d="M26 45.5 L25 53 M32 45.8 L33 53" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>

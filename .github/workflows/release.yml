name: Release

# Cloud packaging: push a tag (v2.2.0, or v2.2.0-beta for a prerelease) and this
# builds → Developer ID signs → notarizes (App Store Connect API key) → staples
# → makes a DMG → Sparkle-signs the .zip → creates the GitHub release → pushes
# the updated appcast.xml to main. Mirrors scripts/release.sh; see
# docs/ci-release.md for the one-time secret setup.
#
# The version bump lives in the tagged commit (do it locally before tagging).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Derive version / channel from tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v2.2.0 or v2.2.0-beta
          RAW="${TAG#v}"                     # 2.2.0 or 2.2.0-beta
          VERSION="${RAW%%-*}"               # 2.2.0
          if [[ "$RAW" == *-* ]]; then PRERELEASE="${RAW#*-}"; else PRERELEASE=""; fi
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG  (version $VERSION, channel '${PRERELEASE:-stable}')"

      - name: Import Developer ID Application certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the search list so xcodebuild finds the cert.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install Developer ID provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          DEST1="$HOME/Library/MobileDevice/Provisioning Profiles"
          DEST2="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$DEST1" "$DEST2"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          cp "$RUNNER_TEMP/profile.provisionprofile" "$DEST1/Perch.provisionprofile"
          cp "$RUNNER_TEMP/profile.provisionprofile" "$DEST2/Perch.provisionprofile"

      - name: Write Sparkle private key file
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private_key"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_private_key"

      - name: Generate Xcode project
        run: xcodegen

      - name: Resolve SPM (Sparkle tools)
        run: |
          xcodebuild -project Perch.xcodeproj -scheme Perch \
            -derivedDataPath .build/release -resolvePackageDependencies

      - name: Build, sign, notarize, publish
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_KEY_PATH: ${{ runner.temp }}/sparkle_ed_private_key
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/package_and_publish.sh

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            dist/**/notary-*.log
          if-no-files-found: ignore
